<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM x Premier League Draft</title>
    <!-- Use a simple sans-serif font for the Premier League modern feel -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inspiration&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image" href="IMGs/football.png">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logos">
                <img src="IMGs/OnlineSoccerManager.png" alt="OSM Logo" class="logo-img osm-img">
                <div class="x-container">
                    <span class="x-mark">X</span>
                </div>
                <img src="IMGs/england_english-premier-league_256x256.football-logos.cc.png" alt="Premier League Logo" class="logo-img pl-img">
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Draft Area (Left) -->
        <section class="draft-section">
            <h2 class="title-accent">
                Premier League Draft
                <span class="blida-text">blida</span>
            </h2>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Enter manager name..." />
                <button id="drawBtn">DRAW CLUB</button>
            </div>
            
            <div class="animation-box">
                <div id="teamDisplay">
                    <span id="teamNameDisplay">?</span>
                    <img id="teamFlagDisplay" src="" alt="flag" style="display: none;">
                </div>
            </div>
        </section>

        <!-- Draft Results Area (Right) -->
        <section class="results-section">
            <div class="card drafted-card">
                <h3>Draft Results</h3>
                <ul id="draftedList"></ul>
            </div>
        </section>
    </main>

    <!-- Small Available Teams Floating Area (Bottom Right) -->
    <div class="small-available-teams">
        <div class="available-header">
            <h4>Available Clubs (<span id="availableCount">0</span>)</h4>
            <button id="toggleAvailableBtn" class="toggle-btn">Hide</button>
        </div>
        <div id="availableTeamsList" class="compact-list"></div>
    </div>

    <!-- Settings Button -->
    <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Clubs</h2>
                <button id="closeSettingsBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="add-team-form">
                    <input type="text" id="newTeamName" placeholder="Club Name">
                    <input type="text" id="newTeamFlag" placeholder="Logo File (.png)">
                    <button id="addTeamBtn">Add</button>
                </div>
                <p class="help-text">Make sure the logo image is placed in the IMGs folder.</p>
                <ul id="settingsTeamsList" class="settings-teams-list"></ul>
                <button id="resetTeamsBtn" class="reset-btn">Reset to Default Clubs</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
